name: Python checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: studyflow
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: studyflow_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyflow -d studyflow_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock.txt
      - run: ruff check app tests scripts migrations
      - run: ruff format --check app tests scripts migrations
      - run: pytest -q
      - name: PostgreSQL, pgvector and migration integration tests
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://studyflow:ci_test_only@127.0.0.1:5432/studyflow_test_ci
      - name: Detect schema drift
        run: python -m alembic check
        env:
          DATABASE_URL: postgresql+psycopg://studyflow:ci_test_only@127.0.0.1:5432/studyflow_test_ci
      - run: python scripts/evaluate_retrieval.py
      - run: node --check app/static/app.js
