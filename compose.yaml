name: studyflow
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studyflow
      POSTGRES_DB: studyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - studyflow-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyflow -d studyflow"]
      interval: 3s
      timeout: 5s
      retries: 20
  studyflow:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://studyflow:${POSTGRES_PASSWORD}@postgres:5432/studyflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  studyflow-postgres-data:
