<!doctype html>
<html lang="zh-CN">
<head>

<body>
  <div id="auth" class="auth-screen" hidden></div>
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#dashboard"><span class="brand-mark">S</span>StudyFlow<span class="brand-dot">●</span></a>
      <div class="workspace-label">PERSONAL WORKSPACE</div>
      <nav id="navigation" aria-label="主导航"></nav>

    <div class="workspace">

      <main id="main" tabindex="-1"></main>
      <footer>STUDYFLOW <span>保持好奇，持续生长。</span><span>FastAPI + Python</span></footer>

  </div>
